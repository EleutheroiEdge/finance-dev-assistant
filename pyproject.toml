[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "finassist"
version = "0.3.0"
description = "Evidence-first, model-neutral developer assistance for finance software"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["httpx==0.28.1", "jsonschema==4.25.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "PyYAML==6.0.3"]

[project.scripts]
finassist = "finassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finassist = ["resources/*.json", "resources/*.md", "resources/*.toml", "resources/dashboard/*", "resources/dashboard/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E4", "E7", "E9", "F", "B", "S", "PLW1514"]
ignore = ["S101", "S603", "S607", "S311"]
