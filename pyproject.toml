[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finledgerpoli"
version = "0.5.0"
description = "AI code review for financial software that keeps your code local and backs every finding with evidence. Works with OpenAI, Anthropic, Gemini or Ollama."
keywords = ["ai code review", "code review", "llm", "finance", "fintech", "quantitative finance", "portfolio optimization", "rebalancing", "model risk", "audit trail", "reproducibility", "developer tools", "local-first", "offline", "ollama", "ai agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["httpx==0.28.1", "jsonschema==4.25.1"]

[project.urls]
Homepage = "https://github.com/EleutheroiEdge/finance-dev-assistant"
Repository = "https://github.com/EleutheroiEdge/finance-dev-assistant"
Documentation = "https://github.com/EleutheroiEdge/finance-dev-assistant/tree/main/docs/"
Issues = "https://github.com/EleutheroiEdge/finance-dev-assistant/issues"
Changelog = "https://github.com/EleutheroiEdge/finance-dev-assistant/blob/main/CHANGELOG.md"
Security = "https://github.com/EleutheroiEdge/finance-dev-assistant/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.14.3", "PyYAML==6.0.3", "readme-renderer[md]==46.0"]

# Hash-locked alongside the dev extra for CI, release builds and wheel smoke checks.
[dependency-groups]
ci = ["build==1.6.1", "twine==7.0.0", "setuptools==84.2.1", "wheel==0.48.0", "maturin==1.15.0", "uv==0.12.17"]

[project.scripts]
finassist = "finassist.cli:main"
finledgerpoli = "finassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Brand source is outside src/; only the prebuilt dashboard icons ship in wheels.
[tool.setuptools.package-data]
finassist = ["resources/*.json", "resources/*.md", "resources/*.toml", "resources/*.py", "resources/dashboard/*", "resources/dashboard/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E4", "E7", "E9", "F", "B", "S", "PLW1514"]
ignore = ["S101", "S603", "S607", "S311"]
