name: checks
on:
  # A pull request's commits are checked once, by the pull_request event. Pushes are checked
  # on main only, so a branch with an open pull request no longer runs every job twice.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer commit on the same pull request cancels the run it replaces. Runs on main never cancel.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The linter runs once, first. The nine test rows wait for it, so a lint error fails in under
  # a minute instead of after the tests on every row. scripts/ci.py is the same entry locally.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pip's cache of downloads and locally built wheels is kept between runs, keyed on the
      # runner's system, the Python version and the hash of the lock. After the lock changes,
      # the action starts from the last cache for the same system and Python. Every download is
      # still verified against the lock. A wheel that pip built locally from a verified source
      # archive (comrak on Windows) is reused from the cache without being checked again.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci.py lint
  test:
    name: ${{ matrix.check_name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', check_name: 'test (3.11)', timeout_minutes: 15}
          - {os: ubuntu-24.04, python: '3.12', check_name: 'test (3.12)', timeout_minutes: 15}
          - {os: ubuntu-24.04, python: '3.13', check_name: 'test (3.13)', timeout_minutes: 15}
          - {os: windows-latest, python: '3.11', check_name: 'platform (Windows, 3.11)', timeout_minutes: 45}
          - {os: windows-latest, python: '3.12', check_name: 'platform (Windows, 3.12)', timeout_minutes: 45}
          - {os: windows-latest, python: '3.13', check_name: 'platform (Windows)', timeout_minutes: 45}
          - {os: macos-latest, python: '3.11', check_name: 'platform (macOS, 3.11)', timeout_minutes: 25}
          - {os: macos-latest, python: '3.12', check_name: 'platform (macOS, 3.12)', timeout_minutes: 25}
          - {os: macos-latest, python: '3.13', check_name: 'platform (macOS)', timeout_minutes: 25}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - name: Run the tests in parallel groups
        run: python scripts/ci_test.py
      - run: finassist demo
      - run: finassist scan --repo .
      - name: Verify a clean wheel installation
        run: python scripts/wheel_smoke.py
  dashboard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: python -m pytest -q tests/test_dashboard.py
      - run: python scripts/ci_install.py pnpm
      - run: python ../scripts/ci_install.py pnpm-run install --frozen-lockfile --ignore-scripts
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run build
        working-directory: dashboard
      - name: Verify shipped assets match their source
        run: git diff --exit-code -- src/finassist/resources/dashboard
      - run: python ../scripts/ci_install.py pnpm-run run test
        working-directory: dashboard
      - name: Install Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: python ../scripts/ci_install.py pnpm-run exec playwright install --with-deps chromium
        working-directory: dashboard
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: python ../scripts/ci_install.py pnpm-run exec playwright install chromium
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run e2e
        working-directory: dashboard
        env:
          FINASSIST_TEST_PYTHON: python
      - run: python scripts/dashboard_wheel_smoke.py
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: docker build -f examples/runner.Dockerfile -t finassist-test-runner .
      - name: Verify real container isolation and cleanup
        shell: bash
        run: |
          image_id="$(docker image inspect finassist-test-runner --format '{{.Id}}')"
          python scripts/container_smoke.py "$image_id" --require-runtime
