name: checks
on:
  # A pull request's commits are checked once, by the pull_request event. Pushes are checked
  # on main only, so a branch with an open pull request no longer runs every job twice.
  push:
    branches: [main]
  # ready_for_review runs the Windows and macOS jobs that a private repository's draft skips.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue's candidate runs everything, as a push to main does.
  merge_group:
permissions:
  contents: read
# A newer commit on the same pull request cancels the run it replaces. Every other run has a group of its own, so a
# push to main and a merge queue's run on the same commit never wait on or replace each other, and runs on main
# never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The linter and the two lock-copy checks run once, first. The nine test rows wait for them,
  # so such an error fails in under a minute instead of after the tests on every row.
  # scripts/ci.py is the same entry locally.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pip's cache of downloads and locally built wheels is kept between runs, keyed on the
      # runner's system, the Python version and the hash of the lock. After the lock changes,
      # the action starts from the last cache for the same system and Python. Every download is
      # still verified against the lock. A wheel that pip built locally from a verified source
      # archive (comrak on Windows) is reused from the cache without being checked again.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci.py fast
  test:
    name: ${{ matrix.check_name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', check_name: 'test (3.11)', timeout_minutes: 15}
          - {os: ubuntu-24.04, python: '3.12', check_name: 'test (3.12)', timeout_minutes: 15}
          - {os: ubuntu-24.04, python: '3.13', check_name: 'test (3.13)', timeout_minutes: 15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - name: Run the tests in parallel groups
        run: python scripts/ci_test.py
      - run: finassist demo
      - run: finassist scan --repo .
      - name: Verify a clean wheel installation
        run: python scripts/wheel_smoke.py
  # Windows and macOS: on main, in a merge queue, on a pull request that is not a draft, and always in a public
  # repository, whose minutes are free. In a private repository a draft's pushes run the Linux rows only, and marking
  # it ready runs these. The steps are the Linux job's, which a test keeps identical.
  # A private repository's Windows runners have half a public one's cores and the tests run one group per core, so a
  # Windows row takes 30 to 60 minutes there.
  platform:
    name: ${{ matrix.check_name }}
    needs: lint
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: '3.11', check_name: 'platform (Windows, 3.11)', timeout_minutes: 90}
          - {os: windows-latest, python: '3.12', check_name: 'platform (Windows, 3.12)', timeout_minutes: 90}
          - {os: windows-latest, python: '3.13', check_name: 'platform (Windows)', timeout_minutes: 90}
          - {os: macos-latest, python: '3.11', check_name: 'platform (macOS, 3.11)', timeout_minutes: 25}
          - {os: macos-latest, python: '3.12', check_name: 'platform (macOS, 3.12)', timeout_minutes: 25}
          - {os: macos-latest, python: '3.13', check_name: 'platform (macOS)', timeout_minutes: 25}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - name: Run the tests in parallel groups
        run: python scripts/ci_test.py
      - run: finassist demo
      - run: finassist scan --repo .
      - name: Verify a clean wheel installation
        run: python scripts/wheel_smoke.py
  dashboard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: python -m pytest -q tests/test_dashboard.py
      - run: python scripts/ci_install.py pnpm
      - run: python ../scripts/ci_install.py pnpm-run install --frozen-lockfile --ignore-scripts
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run build
        working-directory: dashboard
      - name: Verify shipped assets match their source
        run: git diff --exit-code -- src/finassist/resources/dashboard
      - run: python ../scripts/ci_install.py pnpm-run run test
        working-directory: dashboard
      - name: Install Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: python ../scripts/ci_install.py pnpm-run exec playwright install --with-deps chromium
        working-directory: dashboard
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: python ../scripts/ci_install.py pnpm-run exec playwright install chromium
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run e2e
        working-directory: dashboard
        env:
          FINASSIST_TEST_PYTHON: python
      - run: python scripts/dashboard_wheel_smoke.py
  # Windows and macOS: on main, in a merge queue, on a pull request that is not a draft, and always in a public
  # repository, whose minutes are free. In a private repository a draft's pushes run the Linux rows only, and marking
  # it ready runs these. The steps are the Linux job's, which a test keeps identical.
  dashboard-platform:
    name: dashboard (${{ matrix.os }})
    needs: lint
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: python -m pytest -q tests/test_dashboard.py
      - run: python scripts/ci_install.py pnpm
      - run: python ../scripts/ci_install.py pnpm-run install --frozen-lockfile --ignore-scripts
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run build
        working-directory: dashboard
      - name: Verify shipped assets match their source
        run: git diff --exit-code -- src/finassist/resources/dashboard
      - run: python ../scripts/ci_install.py pnpm-run run test
        working-directory: dashboard
      - name: Install Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: python ../scripts/ci_install.py pnpm-run exec playwright install --with-deps chromium
        working-directory: dashboard
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: python ../scripts/ci_install.py pnpm-run exec playwright install chromium
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run e2e
        working-directory: dashboard
        env:
          FINASSIST_TEST_PYTHON: python
      - run: python scripts/dashboard_wheel_smoke.py
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: docker build -f examples/runner.Dockerfile -t finassist-test-runner .
      - name: Verify real container isolation and cleanup
        shell: bash
        run: |
          image_id="$(docker image inspect finassist-test-runner --format '{{.Id}}')"
          python scripts/container_smoke.py "$image_id" --require-runtime
  # One check for branch protection to require: it passes only when every job above ran and passed. A job its
  # condition skipped, as the Windows and macOS jobs of a private repository's draft, counts as not passed, so a
  # draft's run never reads as mergeable.
  all-checks:
    if: ${{ always() }}
    needs: [lint, test, platform, dashboard, dashboard-platform, isolation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have run and passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          PRIVATE_DRAFT: >-
            ${{ github.event.repository.private && github.event_name == 'pull_request'
            && github.event.pull_request.draft }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: need["result"] for job, need in json.loads(os.environ["RESULTS"]).items()}
          missing = sorted(f"{job}: {result}" for job, result in results.items() if result != "success")
          print("not passed:", ", ".join(missing) if missing else "none")
          if os.environ.get("PRIVATE_DRAFT") == "true" and set(results.values()) == {"success", "skipped"}:
              print("A draft in a private repository skips Windows and macOS: mark it ready to run them.")
          sys.exit(1 if not results or missing else 0)
          PY
