name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', check_name: 'test (3.11)', timeout_minutes: 15}
          - {os: ubuntu-24.04, python: '3.12', check_name: 'test (3.12)', timeout_minutes: 15}
          - {os: ubuntu-24.04, python: '3.13', check_name: 'test (3.13)', timeout_minutes: 15}
          - {os: windows-latest, python: '3.11', check_name: 'platform (Windows, 3.11)', timeout_minutes: 30}
          - {os: windows-latest, python: '3.12', check_name: 'platform (Windows, 3.12)', timeout_minutes: 30}
          - {os: windows-latest, python: '3.13', check_name: 'platform (Windows)', timeout_minutes: 30}
          - {os: macos-latest, python: '3.11', check_name: 'platform (macOS, 3.11)', timeout_minutes: 15}
          - {os: macos-latest, python: '3.12', check_name: 'platform (macOS, 3.12)', timeout_minutes: 15}
          - {os: macos-latest, python: '3.13', check_name: 'platform (macOS)', timeout_minutes: 15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: python -m pytest -q
      - run: ruff check src tests scripts actions
      - run: finassist demo
      - run: finassist scan --repo .
      - name: Verify a clean wheel installation
        run: python scripts/wheel_smoke.py
  dashboard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: python -m pytest -q tests/test_dashboard.py
      - run: python scripts/ci_install.py pnpm
      - run: python ../scripts/ci_install.py pnpm-run install --frozen-lockfile --ignore-scripts
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run build
        working-directory: dashboard
      - name: Verify shipped assets match their source
        run: git diff --exit-code -- src/finassist/resources/dashboard
      - run: python ../scripts/ci_install.py pnpm-run run test
        working-directory: dashboard
      - name: Install Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: python ../scripts/ci_install.py pnpm-run exec playwright install --with-deps chromium
        working-directory: dashboard
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: python ../scripts/ci_install.py pnpm-run exec playwright install chromium
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run e2e
        working-directory: dashboard
        env:
          FINASSIST_TEST_PYTHON: python
      - run: python scripts/dashboard_wheel_smoke.py
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: docker build -f examples/runner.Dockerfile -t finassist-test-runner .
      - name: Verify real container isolation and cleanup
        shell: bash
        run: |
          image_id="$(docker image inspect finassist-test-runner --format '{{.Id}}')"
          python scripts/container_smoke.py "$image_id" --require-runtime
