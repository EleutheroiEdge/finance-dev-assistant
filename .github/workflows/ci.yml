name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', check_name: 'test (3.11)'}
          - {os: ubuntu-24.04, python: '3.12', check_name: 'test (3.12)'}
          - {os: ubuntu-24.04, python: '3.13', check_name: 'test (3.13)'}
          - {os: windows-latest, python: '3.11', check_name: 'platform (Windows, 3.11)'}
          - {os: windows-latest, python: '3.12', check_name: 'platform (Windows, 3.12)'}
          - {os: windows-latest, python: '3.13', check_name: 'platform (Windows)'}
          - {os: macos-latest, python: '3.11', check_name: 'platform (macOS, 3.11)'}
          - {os: macos-latest, python: '3.12', check_name: 'platform (macOS, 3.12)'}
          - {os: macos-latest, python: '3.13', check_name: 'platform (macOS)'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q
      - run: ruff check src tests scripts
      - run: finassist demo
      - run: finassist scan --repo .
      - name: Verify a clean wheel installation
        run: python scripts/wheel_smoke.py
  dashboard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q tests/test_dashboard.py
      - run: npm install --global pnpm@12.9.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: dashboard
      - run: pnpm run build
        working-directory: dashboard
      - name: Verify shipped assets match their source
        run: git diff --exit-code -- src/finassist/resources/dashboard
      - run: pnpm run test
        working-directory: dashboard
      - name: Install Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: dashboard
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium
        working-directory: dashboard
      - run: pnpm run e2e
        working-directory: dashboard
        env:
          FINASSIST_TEST_PYTHON: python
      - run: python scripts/dashboard_wheel_smoke.py
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: docker build -f examples/runner.Dockerfile -t finassist-test-runner .
      - name: Verify real container isolation and cleanup
        shell: bash
        run: |
          image_id="$(docker image inspect finassist-test-runner --format '{{.Id}}')"
          python scripts/container_smoke.py "$image_id" --require-runtime
