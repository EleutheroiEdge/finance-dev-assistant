name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Verify version, merged source, tag-only deployment and protected release tags
        run: python scripts/release_checks.py --tag "$RELEASE_TAG" --check-environment
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/ci_install.py dependencies
      - run: python scripts/ci_install.py project
      - run: python -m pytest -q
      - run: ruff check src tests scripts
      - run: finassist demo
      - run: finassist scan --repo .
      - run: python scripts/ci_install.py pnpm
      - run: python ../scripts/ci_install.py pnpm-run install --frozen-lockfile --ignore-scripts
        working-directory: dashboard
      - run: python ../scripts/ci_install.py pnpm-run run build
        working-directory: dashboard
      - name: Verify shipped assets match source
        run: git diff --exit-code -- src/finassist/resources/dashboard
      - run: python ../scripts/ci_install.py pnpm-run run test
        working-directory: dashboard
      - name: Extract release notes
        run: python scripts/release_checks.py --tag "$RELEASE_TAG" --notes-output release-notes.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Build sdist and wheel from the sdist, reproducibly, from a clean checkout of the tag
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          git worktree add --detach "$RUNNER_TEMP/source" HEAD
          python -m build --no-isolation --outdir dist "$RUNNER_TEMP/source"
          python scripts/normalize_sdist.py dist
      - run: python -m twine check --strict dist/*
      - name: Generate and verify hash-locked runtime requirements
        run: python scripts/release_requirements.py --dist dist --output release-assets
      - run: python scripts/wheel_smoke.py
      - run: python scripts/dashboard_wheel_smoke.py
      - name: Generate source and distribution SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release-sbom.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - name: Preserve distributions and SBOM for the gates and publishing jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-sbom.spdx.json
            release-notes.md
            release-assets/*-requirements.txt
          if-no-files-found: error
          retention-days: 30
  # In place of a person's approval: before anything is published, the wheel and the sdist must be, byte for byte,
  # what an independent build of a clean checkout of the tag makes, the sdist must build the wheel, and the wheel,
  # installed by its hash, must pass the whole test suite and the demo. The publishing job then publishes only files
  # with the digest this job recorded.
  gates:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.gated.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Record the digest of every downloaded file, for the publishing job
        id: gated
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          test -z "$(find . ! -type f ! -type d -print -quit)"
          test -n "$(find . -type f -print -quit)"
          digest=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0r sha256sum -z | sha256sum | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Before anything is published: the publishing job attaches these to the GitHub release after PyPI, when a
      # missing one could no longer stop it.
      - name: Verify the artifact holds everything the publishing job attaches
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          # One check a line: under set -e, a failure before the last && of a list would not stop the script.
          test -f release-sbom.spdx.json
          test -s release-sbom.spdx.json
          test -f release-notes.md
          test -s release-notes.md
          for file in release-assets/*-requirements.txt; do
            test -f "$file"
            test -s "$file"
            case "${file#release-assets/}" in *[!A-Za-z0-9._-]*) exit 1 ;; esac
          done
      - run: python scripts/ci_install.py dependencies
      - name: Build the wheel and the sdist again, the same way, from a clean checkout of the tag
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          git worktree add --detach "$RUNNER_TEMP/source" HEAD
          python -m build --no-isolation --outdir "$RUNNER_TEMP/rebuilt" "$RUNNER_TEMP/source"
          python scripts/normalize_sdist.py "$RUNNER_TEMP/rebuilt"
      - name: Verify the release archives are that build's, byte for byte, the sdist builds the wheel, and the notes are the tag's
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          python scripts/release_checks.py --tag "$RELEASE_TAG" --distributions-match-rebuild "$RUNNER_TEMP/release/dist" "$RUNNER_TEMP/rebuilt" --sdist-builds-the-wheel "$RUNNER_TEMP/release/dist"
          python scripts/release_checks.py --tag "$RELEASE_TAG" --notes-output "$RUNNER_TEMP/notes.md"
          cmp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release/release-notes.md"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Install the built wheel by its hash, in place of the tree
        run: python scripts/ci_install.py wheel "$RUNNER_TEMP/release/dist"
      - name: Run the whole test suite against the installed wheel, never the tree
        run: python scripts/ci_test.py
        env:
          FINASSIST_REQUIRE_INSTALLED: "1"
      - run: finassist demo
        working-directory: ${{ runner.temp }}
  publish:
    needs: [build, gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/finledgerpoli/
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Verify these are the files the gates job tested
        run: |
          set -euo pipefail
          cd release
          test -z "$(find . ! -type f ! -type d -print -quit)"
          digest=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0r sha256sum -z | sha256sum | cut -d ' ' -f 1)
          test -n "$GATED" && test "$digest" = "$GATED"
        env:
          GATED: ${{ needs.gates.outputs.digest }}
      - name: Attest distribution and SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/dist/*
            release/release-sbom.spdx.json
            release/release-assets/*-requirements.txt
      - name: Attach the SBOM attestation to distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/dist/*
          sbom-path: release/release-sbom.spdx.json
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/dist/
          attestations: true
      - name: Attach distributions, requirements, SBOM and notes to the GitHub release
        run: gh release create "$RELEASE_TAG" release/dist/* release/release-sbom.spdx.json release/release-assets/*-requirements.txt --verify-tag --title "$RELEASE_TAG" --notes-file release/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
