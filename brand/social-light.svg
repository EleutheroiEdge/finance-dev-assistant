<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2f7a63"/>
      <stop offset="1" stop-color="#28634f"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2ec"/>
      <stop offset="1" stop-color="#e6ede7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- ledger ruling texture -->
  <g stroke="#212b26" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>
  <!-- ledger double margin rule -->
  <g stroke="#2f7a63" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="88" y1="0" x2="88" y2="640"/>
    <line x1="96" y1="0" x2="96" y2="640"/>
  </g>

  <!-- eyebrow -->
  <text x="130" y="112" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17" letter-spacing="4.5" fill="#28634f">LOCAL CODE. YOUR DECISIONS.</text>

  <!-- lockup: f-C3 green tile -->
  <g transform="translate(130,140) scale(1.3125)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
    <g stroke="#e1ebe4" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round">
      <line x1="13" y1="14" x2="51" y2="14"/>
      <line x1="13" y1="50" x2="51" y2="50"/>
    </g>
    <path d="M29 46 V20 H43" fill="none" stroke="#e1ebe4" stroke-width="7.5" stroke-linecap="butt" stroke-linejoin="round"/>
    <line x1="25.5" y1="33" x2="51" y2="33" stroke="#8fc3ab" stroke-width="6" stroke-linecap="butt"/>
  </g>
  <text x="234" y="200" font-family="'Ubuntu Sans','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="600" letter-spacing="-0.6" fill="#212b26">finledgerpoli</text>

  <!-- subtitle -->
  <text x="130" y="292" font-family="'Ubuntu Sans','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="26" fill="#3c4a42">AI code review for financial software that keeps</text>
  <text x="130" y="330" font-family="'Ubuntu Sans','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="26" fill="#3c4a42">your code local and backs every finding with evidence.</text>

  <!-- assurance chips -->
  <g font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#55655c">
    <polyline points="132,540 137,546 146,534" fill="none" stroke="#28634f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="546">OFFLINE BY DEFAULT</text>
    <polyline points="372,540 377,546 386,534" fill="none" stroke="#28634f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="398" y="546">YOUR MODEL</text>
    <polyline points="540,540 545,546 554,534" fill="none" stroke="#28634f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="566" y="546">REPRODUCIBLE CHECKS</text>
  </g>

  <!-- finding card stack (fictional) -->
  <rect x="846" y="144" width="380" height="452" rx="16" fill="#e0e7e1" stroke="#cfd9d1" transform="rotate(1.6 1036 370)"/>
  <g>
    <rect x="820" y="126" width="380" height="452" rx="16" fill="#fbfcfb" stroke="#d9e0da"/>
    <!-- card header -->
    <text x="848" y="166" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" letter-spacing="1.5" fill="#28634f">FINDING f-042</text>
    <text x="1172" y="166" text-anchor="end" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#55655c">MEDIUM</text>
    <line x1="848" y1="186" x2="1172" y2="186" stroke="#d9e0da" stroke-width="1.5"/>
    <!-- finding -->
    <text x="848" y="222" font-family="'Ubuntu Sans','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#212b26">Drift check skipped after</text>
    <text x="848" y="250" font-family="'Ubuntu Sans','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#212b26">tax-lot override</text>
    <text x="848" y="282" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#55655c">engine/rebalance.py:218</text>
    <text x="848" y="304" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#55655c">pinned to commit 4c7a1e2</text>
    <!-- diff snippet folded into the card -->
    <rect x="848" y="320" width="324" height="58" rx="8" fill="#eef3ee" stroke="#d9e0da"/>
    <text x="862" y="343" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#a25448">- drift_check(lots, mode=lazy)</text>
    <text x="862" y="365" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#28634f">+ drift_check(lots, mode=strict)</text>
    <!-- reproduced pill -->
    <rect x="848" y="394" width="258" height="34" rx="17" fill="#28634f" fill-opacity="0.12" stroke="#2f7a63"/>
    <polyline points="866,411 871,417 880,405" fill="none" stroke="#28634f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="892" y="416" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" letter-spacing="1" fill="#28634f">REPRODUCED · YOUR CHECKS</text>
    <!-- evidence facts, evenly spaced -->
    <polyline points="850,447 855,453 863,442" fill="none" stroke="#28634f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="874" y="452" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#55655c">checks 12 / 12 pass</text>
    <circle cx="855" cy="471" r="3.5" fill="#2f7a63"/>
    <text x="874" y="476" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#55655c">$0.06 of $5.00 today</text>
    <circle cx="855" cy="495" r="3.5" fill="#2f7a63"/>
    <text x="874" y="500" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#55655c">patch pending human approval</text>
    <line x1="848" y1="520" x2="1172" y2="520" stroke="#d9e0da" stroke-width="1.5"/>
    <text x="848" y="538" font-family="'Ubuntu Sans Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="0.5" fill="#55655c">RECORDED IN LOCAL AUDIT TRAIL</text>
  </g>
</svg>
